id: agent_decompose
description: Split a user question into independent sub-queries for multi-hop RAG
versions:
  - version: 1
    created_at: "2026-08-03"
    author: yang
    changelog: "MVP agent decompose"
    active: false
    template: |-
      You plan retrieval for an industrial PDF QA system.
      Split the QUESTION into at most {max_subqueries} self-contained sub-queries.
      If the question is already atomic, return a single sub-query equal to the question.
      Keep product / proper names intact (e.g. "RAG-Anything" is one unit — do not split into letters).
      Each sub-query must be understandable alone (no "the above value").
      subqueries MUST be a JSON array of plain strings only — never objects, never source/reason fields inside the array.
      Return ONLY JSON:
      {{"subqueries": ["plain string query 1", "plain string query 2"], "strategy": "atomic"|"multi", "reason": "short"}}

      QUESTION:
      {query}

  - version: 2
    created_at: "2026-08-06"
    author: yang
    changelog: "Phase2 postmortem: avoid over-split; keep contrast entities; no abstract filler subqueries"
    active: true
    template: |-
      You plan retrieval for an industrial PDF QA system (USAF / aircraft / maintenance manuals).

      Split the QUESTION into at most {max_subqueries} self-contained sub-queries for search.

      Rules (strict):
      1) ATOMIC by default: single fact, yes/no, number, one procedure step, one named object →
         strategy="atomic" and subqueries = [the original QUESTION unchanged].
      2) MULTI only when the question needs evidence from TWO OR MORE distinct topics/places
         (e.g. contrast A vs B, X and also Y, two manuals, two commodities).
      3) For contrast / difference / distinguish questions: emit exactly one sub-query per side
         that KEEPS the entity names (manual title, vehicle type, chemical, etc.). Do NOT drop a side.
      4) Do NOT add a third "analyze both / synthesize / frameworks that integrate" meta-query.
         Synthesis happens later; retrieval sub-queries must be searchable facts.
      5) Keep product / proper names intact. No anaphora ("the above", "that manual").
      6) subqueries MUST be a JSON array of plain strings only — never objects.

      Return ONLY JSON:
      {{"subqueries": ["plain string query 1", "..."], "strategy": "atomic"|"multi", "reason": "short", "arm_hints": {{"<subquery>": "visual"|"bm25"|"dense"|"mixed"}}}}

      arm_hints is optional: per sub-query, hint which retrieval arm is most likely to find it.
      - "visual" if the answer likely lives in a table / chart / figure / page layout
      - "bm25" for exact product / part / manual / command names
      - "dense" for semantic / conceptual / comparative meaning
      - "mixed" when both exact and semantic matter (default)
      Only include sub-queries you actually emitted.

      QUESTION:
      {query}
